name: Build & Publish

# Replaces docker-build.yml + docker-build-ui.yml + publish-helm.yml.
#
# One workflow, not three: a backend-only change must still republish the
# chart, or the newest chart keeps pointing at the previous image. The old
# split had disjoint path filters, so that desync was routine.
#
# This file declares only what THIS repo contains. All versioning/changelog
# LOGIC lives in openg2p-packaging behind @v1 -- see that repo's ci/README.md.

# ---- IDENTICAL BOILERPLATE (do not customise per repo) ----------------------
# The two inputs are for occasional changelog fixes only. For a normal run leave
# the checkbox OFF and the text box EMPTY (it rebuilds/publishes the branch).
on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its frozen version e.g. 1.0.1 (not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      # --- IDENTICAL BOILERPLATE ---
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}
      packaging-ref: v1

      # --- PER-REPO DECLARATIONS (customise below for your repo) ---
      # One entry per Docker image. `pins` (per image) resolve a build-arg that
      # is a git ref to a SHA -- neither AWE Dockerfile declares such an ARG
      # (only GIT_COMMIT / BUILD_TIME metadata), so no pins are needed here.
      images: |
        [
          {"name": "openg2p-awe",
           "repo": "openg2p/openg2p-awe",
           "dockerfile": "Dockerfile"},

          {"name": "openg2p-awe-ui",
           "repo": "openg2p/openg2p-awe-ui",
           "dockerfile": "ui/Dockerfile",
           "context": "ui"}
        ]

      chart-path: helm/openg2p-awe

      # Every OpenG2P image the chart deploys. jbergknoff/postgresql-client is
      # third-party and stays pinned in values.yaml.
      chart-image-paths: |
        [".awe.image.tag",
         ".ui.image.tag"]

    # ---- IDENTICAL BOILERPLATE ----
    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      # Org-level secret; if unset the changelog still publishes human notes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
