# nginx config for the AWE admin SPA.
# - Serves static files from /usr/share/nginx/html.
# - Falls back to /index.html for unknown paths so React-router deep links
#   (e.g. /policies/foo/versions/1/edit) don't 404.
# - Has a `location /v1/awe/` that proxies to `awe:8000` as a convenience
#   for docker-compose (where the backend container is named `awe` on the
#   shared bridge network). In Kubernetes under Istio, the host-level
#   VirtualService routes /v1/awe/ to the backend Service before the
#   request reaches this pod — so the block is never hit in production.
# - `resolver 127.0.0.11` + `set $upstream …` + `proxy_pass http://$upstream`
#   keeps DNS resolution LAZY, so nginx starts cleanly in environments
#   where `awe` doesn't resolve at boot time (e.g. k8s).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Lazy DNS — only used when a request actually hits /v1/awe/.
    # 127.0.0.11 is Docker's embedded DNS; harmless in k8s as the block
    # below is unreachable there.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Dev convenience only (docker-compose). Unreachable in k8s under Istio.
    location /v1/awe/ {
        set $awe_backend "awe:8000";
        proxy_pass http://$awe_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for fingerprinted static assets (Vite emits hashed names).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything else → SPA fallback. Prevents 404 on client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No-cache for index.html so clients always re-check after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Standard gzip for the static JS/CSS/HTML the SPA ships.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
