questions:

# General
- variable: global.aweHostname
  description: Hostname under which the AWE service will be accessed
  type: string
  label: AWE Hostname
  group: General

- variable: global.postgresqlHost
  description: PostgreSQL server host
  type: string
  label: PostgreSQL Server Host
  group: General

- variable: global.keycloakBaseUrl
  description: Keycloak base URL (e.g. https://keycloak.example.org)
  type: string
  label: Keycloak Base URL
  group: General

- variable: global.keycloakRealm
  description: Keycloak realm name
  type: string
  label: Keycloak Realm
  group: General

- variable: postgres-init.enabled
  description: Run Postgres init job to create database and user
  type: boolean
  label: Postgres Init
  group: General

- variable: awe.enabled
  description: Install the AWE service
  type: boolean
  label: AWE Service
  group: General

# Webhook
- variable: awe.appConfig.webhook.timeoutSeconds
  description: Per-attempt deadline for the caller's callback handler
  type: int
  label: Webhook Timeout (s)
  group: Webhook

- variable: awe.appConfig.webhook.maxAttempts
  description: Total number of webhook attempts before marking exhausted
  type: int
  label: Max Webhook Attempts
  group: Webhook

# SLA
- variable: awe.appConfig.sla.checkIntervalSeconds
  description: How often the SLA monitor scans for expired stages
  type: int
  label: SLA Check Interval (s)
  group: SLA

# Notifications
- variable: global.notificationEnabled
  description: Master switch for AWE staff notifications. Off skips every send, even when a workflow is listed below.
  type: boolean
  default: true
  label: Enable Notifications
  group: Notifications

- variable: global.notificationProvider
  description: Notification provider used by the AWE API. Novu is the only supported value.
  type: string
  default: novu
  label: Notification Provider
  group: Notifications

- variable: global.notificationProviderUrl
  description: Base URL of the Novu API. In-cluster this is the commons Novu API service.
  type: string
  default: http://commons-novu-api:3000
  label: Notification Provider URL
  group: Notifications

- variable: global.notificationWorkflows
  description: JSON map of AWE event key to Novu workflow id. An event is sent only when its key is listed here. Remove a key to turn that notification off. Novu workflow ids cannot contain dots.
  type: string
  default: '{"approval.stage_started":"approval-stage-started","approval.task_reassigned":"approval-task-reassigned","approval.stage_escalated":"approval-stage-escalated","approval.task_expired":"approval-task-expired","approval.request_approved":"approval-request-approved","approval.request_rejected":"approval-request-rejected","approval.request_cancelled":"approval-request-cancelled","approval.stage_quorum_skipped":"approval-stage-quorum-skipped"}'
  label: Notification Workflows
  group: Notifications

- variable: global.staffPortalBaseUrl
  description: Public staff-ui origin used in AWE notification links (for example https://farmer-registry.dev.openg2p.org). Locale is hardcoded as /en in the Novu workflow. Do not use the AWE admin hostname.
  type: string
  default: ""
  label: Staff Portal Base URL
  group: Notifications

# Image
- variable: awe.image.repository
  description: Docker image repository for AWE
  type: string
  label: Image Repository
  group: Image

- variable: awe.image.tag
  description: Docker image tag
  type: string
  label: Image Tag
  group: Image

# Scaling
- variable: awe.replicaCount
  description: Number of replicas (ignored if HPA is enabled)
  type: int
  label: Replica Count
  group: Scaling

- variable: awe.autoscaling.enabled
  description: Enable Horizontal Pod Autoscaler
  type: boolean
  label: Enable HPA
  group: Scaling

- variable: awe.autoscaling.minReplicas
  description: Minimum replicas under HPA
  type: int
  label: HPA Min Replicas
  group: Scaling

- variable: awe.autoscaling.maxReplicas
  description: Maximum replicas under HPA
  type: int
  label: HPA Max Replicas
  group: Scaling
