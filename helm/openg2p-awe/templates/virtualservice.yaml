{{- /*
One Istio VirtualService covering the whole host. Two routes, ordered:

  1. /v1/awe/   → backend Service  (more specific prefix — matched first)
  2. /          → UI Service       (catch-all for the SPA)

Istio evaluates `http` rules in declaration order and uses the first match
— so as long as the backend rule comes first, API calls go to the backend
and everything else falls through to the UI.
*/ -}}
{{- if and .Values.awe.enabled .Values.awe.istio.enabled .Values.istio.virtualservice.enabled }}
{{- $host := include "common.tplvalues.render" (dict "value" .Values.istio.virtualservice.host "context" .) }}
{{- $gateway := .Values.istio.virtualservice.gateway }}

{{- /* Resolve the backend + UI Service names via each stanza's common.names.fullname */ -}}
{{- $backendCtx := dict "Values" (merge (deepCopy .Values.awe) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
{{- $backendName := include "common.names.fullname" $backendCtx -}}
{{- $backendPort := .Values.awe.service.port -}}

{{- $uiName := "" -}}
{{- $uiPort := 80 -}}
{{- if .Values.ui.enabled -}}
  {{- $uiCtx := dict "Values" (merge (deepCopy .Values.ui) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
  {{- $uiName = include "common.names.fullname" $uiCtx -}}
  {{- $uiPort = .Values.ui.service.port -}}
{{- end -}}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-awe
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" .) | nindent 4 }}
spec:
  hosts:
    - {{ $host | quote }}
  gateways:
    - {{ $gateway }}
  http:
    # ----- Backend: /v1/awe/* -----
    - name: backend
      match:
        - uri:
            prefix: /v1/awe/
      headers:
        request:
          set:
            x-forwarded-host: {{ $host | quote }}
            x-forwarded-proto: https
      route:
        - destination:
            host: {{ $backendName }}
            port:
              number: {{ $backendPort }}
    {{- if .Values.ui.enabled }}
    # ----- UI: everything else (catch-all) -----
    - name: ui
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ $uiName }}
            port:
              number: {{ $uiPort }}
    {{- end }}
{{- end }}
