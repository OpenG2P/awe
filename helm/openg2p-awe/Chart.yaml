apiVersion: v2
name: openg2p-awe
description: A Helm chart for the OpenG2P Approval Workflow Engine
type: application
version: 1.0.0-develop
dependencies:
- name: common
  repository: https://openg2p.github.io/openg2p-helm
  version: 2.30.0
- name: postgres-init
  version: 1.1.0
  repository: https://openg2p.github.io/openg2p-helm
  condition: postgres-init.enabled
- name: keycloak-init
  version: 1.1.0-develop
  repository: https://openg2p.github.io/openg2p-helm
  condition: keycloak-init.enabled
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
keywords:
  - openg2p
  - approval
  - workflow
  - awe
maintainers:
  - email: info@openg2p.org
    name: OpenG2P
annotations:
  catalog.cattle.io/display-name: "OpenG2P Approval Workflow Engine"
  openg2p.org/add-to-rancher: ""
