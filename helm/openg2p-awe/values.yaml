global:
  aweHostname: 'awe.trial.openg2p.org'

  # Database (provisioned by the postgres-init subchart)
  postgresqlHost: commons-postgresql
  aweDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  aweDBPort: 5432
  aweDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  aweDBSecret: '{{ .Release.Name }}'
  aweDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # Keycloak (shared with Registry / PBMS — same realm, same commons-keycloak deployment)
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  keycloakRealm: 'staff'
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  # OIDC client the admin SPA redirects to for login
  aweAdminPortalClientId: 'awe-admin-portal'
  # Service-account client used by AWE to call Keycloak admin API (for
  # `role:` and `group:` approver rule resolution)
  aweAdminResolverClientId: 'awe-admin-resolver'
  # K8s Secret holding the admin-resolver client secret. Created by
  # keycloak-init's `client-secrets.yaml` template — the Secret is named
  # after the clientId, and keycloak-init reads it back when provisioning
  # the client so Keycloak and K8s stay in sync.
  aweAdminResolverSecretName: 'awe-admin-resolver'
  aweAdminResolverSecretKey: 'client_secret'

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.aweDB $ }}'
      user: '{{ tpl .Values.global.aweDBUser $ }}'
      secret: '{{ tpl .Values.global.aweDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.aweDBUserPasswordKey $ }}'

# ---------------------------------------------------------------------------
# keycloak-init — provisions AWE's clients, roles, and role-mappings in the
# shared `staff` realm. Mirrors the pattern used by openg2p-registry.
#
# What keycloak-init does automatically:
#   1. Creates clients `awe-admin-portal` and `awe-admin-resolver` with
#      service accounts enabled (keycloak-init always sets
#      `serviceAccountsEnabled: true` for created clients).
#   2. Materialises the `awe-admin` client role on awe-admin-portal.
#   3. Creates K8s Secrets named after each clientId (`awe-admin-portal`,
#      `awe-admin-resolver`) with key `client_secret`. The init job reads
#      these on subsequent runs so Keycloak and K8s stay in lock-step.
#   4. Maps roles from the `users:` block — including role mappings on
#      service-account users (Keycloak auto-creates
#      `service-account-<clientId>` whenever a client has service accounts
#      enabled). We use this below to grant the resolver's service account
#      the realm-management roles `view-users` + `query-groups` needed for
#      `role:` / `group:` approver rule resolution.
#
# Assumptions:
#   * A commons-keycloak is already deployed in the namespace (shared by
#     Registry / PBMS / AWE); its auto-created admin secret is
#     `commons-keycloak`.
#   * The `admin` user exists in the `staff` realm (created by the commons
#     layer); we map the `awe-admin` role onto it so first-install
#     operators can log into the admin SPA out of the box.
# ---------------------------------------------------------------------------
keycloak-init:
  enabled: true
  keycloak:
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    staff:
      clients:
        - clientId: awe-admin-portal
          name: AWE Admin Portal
          description: OIDC client used by AWE's bundled admin SPA for policy authors.
          # SPA ⇒ public client with PKCE + Web Origins for the browser-side
          # token exchange. The upstream keycloak-init (≥ 1.1.0-develop)
          # now honours this field, so the client is created as public at
          # install time — no post-install UI toggle needed.
          # See deployment.md for the "why public, not confidential"
          # explanation (TL;DR: a browser can't keep a secret; PKCE
          # replaces the client_secret cryptographically — RFC 8252, 7636).
          publicClient: true
          # Explicit redirect URI (no wildcard). A `*` here would break
          # CORS because Keycloak's `webOrigins: ["+"]` shorthand filters
          # wildcard entries out, yielding an empty allowed-origins set
          # and a silently-blocked browser token POST.
          # The hostname is resolved at install time — the keycloak-init
          # subchart's ConfigMap now runs `tpl` over the clients block,
          # so `{{ ... }}` here expands against `.Values.global`. `tpl`
          # wraps aweHostname so per-env overrides containing template
          # expressions (e.g. "awe.{{ .Release.Namespace }}.…") also work.
          redirectUris:
            - 'https://{{ tpl .Values.global.aweHostname $ }}/*'
          # "+" = "use the Valid Redirect URIs list above, filtered to
          # non-wildcard entries". Works because redirectUris is explicit.
          webOrigins: ["+"]
          clientRoles:
            # AWE_ADMIN — full read + write (policies, cancellations, retries).
            - "AWE_ADMIN"
            # AWE_VIEWER — read-only access to policies, requests, deliveries, audit log.
            - "AWE_VIEWER"
        - clientId: awe-admin-resolver
          name: AWE Admin Resolver (service account)
          description: S2S client used by AWE to resolve Keycloak role/group members.
      users:
        # Assumes `admin` is already provisioned by the commons layer.
        # Gets AWE_ADMIN so first-install operators can log into the admin SPA.
        - username: admin
          clientRoleMappings:
            awe-admin-portal:
              - "AWE_ADMIN"
        # Service-account user auto-created by Keycloak when the client
        # above has `serviceAccountsEnabled: true`. We grant it the built-in
        # `realm-management` roles needed to look up role / group members.
        #
        #   view-users    — list users, read role mappings. Required for
        #                   both realm-role and client-role member queries.
        #   view-clients  — translate clientId → internal UUID, required
        #                   before hitting the client-role members endpoint
        #                   (needed when approver rules reference roles
        #                   defined on a Caller's client, e.g. Registry).
        #   query-groups  — list group members for `group:` rules.
        #
        # These are realm-wide reads — the service account can enumerate
        # users/clients across every client in the realm. If the realm has
        # Fine-Grained Admin Permissions enabled, additional per-client
        # grants are needed; see deployment.md.
        - username: service-account-awe-admin-resolver
          clientRoleMappings:
            realm-management:
              - "view-users"
              - "view-clients"
              - "query-groups"

awe:
  enabled: true
  nameOverride: awe
  hostname: '{{ tpl .Values.global.aweHostname $ }}'

  # Single replica for now — trial deployments see very low request volume
  # and HPA adds churn without winning anything. Flip `autoscaling.enabled`
  # to true and bump `minReplicas` when traffic actually warrants it.
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-awe
    tag: "develop"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1000
  containerSecurityContext:
    enabled: false
    runAsUser: 1000
    runAsNonRoot: true

  # -- Resource requests/limits. Tune to expected request volume.
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 256Mi
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  # Per-pod Istio bits (optional gateway). Host-level routing lives in the
  # chart-level `istio.virtualservice` block below, which creates a single
  # VirtualService with two routes: `/v1/awe/` → backend, `/` → UI.
  istio:
    enabled: true
    gateway:
      enabled: false
      host: '{{ tpl .Values.awe.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # ---------------------------------------------------------------------------
  # Application config — rendered as a ConfigMap and mounted at
  # /app/config/config.yaml. Mirrors src/awe/config.py shape.
  # ---------------------------------------------------------------------------
  appConfig:
    serviceId: openg2p.awe
    apiVersion: "1.0"
    # Logical caller module this AWE deployment serves.
    module: default

    webhook:
      timeoutSeconds: 10
      maxAttempts: 6
      backoffSeconds: [60, 300, 900, 3600, 21600]
      pollIntervalSeconds: 2
      batchSize: 20

    resolver:
      httpTimeoutSeconds: 5

    sla:
      checkIntervalSeconds: 300

    keycloak:
      baseUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
      realm: '{{ tpl .Values.global.keycloakRealm $ }}'
      adminClientId: '{{ tpl .Values.global.aweAdminResolverClientId $ }}'
      issuer: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
      jwksUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/certs'
      # Audience claim expected on inbound bearers. Matches the admin portal
      # client id — tokens minted for that client carry `aud: awe-admin-portal`.
      audience: '{{ tpl .Values.global.aweAdminPortalClientId $ }}'

    notifier:
      enabled: false
      smtpHost: ''
      smtpPort: 587
      fromAddress: no-reply@openg2p.org
      useTls: true

  # ---------------------------------------------------------------------------
  # Environment variables
  # ---------------------------------------------------------------------------
  envVars:
    DB_HOST: '{{ .Values.global.postgresqlHost }}'
    DB_PORT: '{{ .Values.global.aweDBPort }}'
    DB_NAME: '{{ tpl .Values.global.aweDB $ }}'
    DB_USER: '{{ tpl .Values.global.aweDBUser $ }}'
    CONFIG_PATH: /app/config/config.yaml

  envVarsFrom:
    DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.aweDBSecret $ }}'
        key: '{{ tpl .Values.global.aweDBUserPasswordKey $ }}'
    # Keycloak admin-resolver client secret — provisioned by keycloak-init.
    AWE__KEYCLOAK__ADMIN_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.aweAdminResolverSecretName $ }}'
        key: '{{ .Values.global.aweAdminResolverSecretKey }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /v1/awe/health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /v1/awe/health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /v1/awe/health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until psql "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}" -c "SELECT 1" > /dev/null 2>&1; do echo "Waiting for database ${DB_NAME} to be ready..."; sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

# ---------------------------------------------------------------------------
# UI (openg2p-awe-ui) — static SPA served by nginx. Low-traffic admin surface,
# so a single replica with minimal resources is the default. Routing to this
# Service lives in the chart-level `istio.virtualservice` block at the bottom.
# ---------------------------------------------------------------------------
ui:
  enabled: true
  nameOverride: awe-ui
  hostname: '{{ tpl .Values.global.aweHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-awe-ui
    tag: "develop"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 101          # nginx-unprivileged user
  containerSecurityContext:
    enabled: false
    runAsUser: 101
    runAsNonRoot: true

  # Minimal — a tiny nginx serving static JS/CSS/HTML doesn't need more.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 10
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  containerPort: 8080

# ---------------------------------------------------------------------------
# Istio routing — ONE VirtualService, TWO routes.
#   `/v1/awe/` → backend Service (longer prefix wins; Istio evaluates in order)
#   `/`        → UI Service (catch-all for everything else under the host)
# Single VS keeps the host's routing deterministic without relying on Istio's
# cross-VS merge behaviour.
# ---------------------------------------------------------------------------
istio:
  virtualservice:
    enabled: true
    host: '{{ tpl .Values.global.aweHostname $ }}'
    gateway: "internal"
