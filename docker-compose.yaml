services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: awe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  awe:
    build:
      context: .
      args:
        GIT_COMMIT: local
        BUILD_TIME: local
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: awe
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Notifications (openg2p-notification, Novu). Unset = disabled — the
      # connector skips every send while NOTIFICATION_WORKFLOWS is empty.
      # Point at the workspace Novu (root docker-compose.yml) for local dev.
      # NOTIFICATION_PROVIDER_URL: http://host.docker.internal:3000
      # NOTIFICATION_PROVIDER_API_KEY: <novu secret key>
      # NOTIFICATION_WORKFLOWS: '{"approval.stage_started":"approval-stage-started","approval.task_reassigned":"approval-task-reassigned","approval.stage_escalated":"approval-stage-escalated","approval.task_expired":"approval-task-expired","approval.request_approved":"approval-request-approved","approval.request_rejected":"approval-request-rejected","approval.request_cancelled":"approval-request-cancelled","approval.stage_quorum_skipped":"approval-stage-quorum-skipped"}'
      # NOTIFICATION_STAFF_PORTAL_BASE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # Static SPA served by nginx. In production this is routed by Istio at
  # the host level; locally we expose it on :8080 and the UI's fetch calls
  # hit the backend on the same machine via the browser's origin (see nginx
  # proxy_pass for the /v1/awe prefix below, which is a local-dev nicety —
  # production nginx never proxies; Istio does host-level routing).
  awe-ui:
    build:
      context: ./ui
      args:
        GIT_COMMIT: local
        BUILD_TIME: local
    ports:
      - "8080:8080"
    depends_on:
      - awe
    restart: on-failure

volumes:
  pgdata:
