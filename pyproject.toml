[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "openg2p-awe"
# Static PEP 440 placeholder. Do NOT set this to "develop" — Python packaging
# validates project.version against PEP 440 and "develop" is rejected, which
# breaks `pip install` and the Dockerfile's `python -m build --wheel`. The real
# release version is derived from the git ref by openg2p-packaging CI and
# applied to the Docker image tag + Helm chart, not to this file.
version = "0.0.0"
description = "OpenG2P Approval Workflow Engine — generic, configurable multi-stage approval service for OpenG2P modules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "json-logic-qubit>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-html>=4.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/awe"]
branch = false

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
